<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | We Write You Chill</title>
  <link rel="icon" type="image/png" href="/we-write-you-chill-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
    rel="stylesheet">
  <meta http-equiv="refresh" content="4; url=/" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #FAF9F7;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 28px;
      padding: 48px 36px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px -15px rgba(38, 80, 168, 0.12);
    }

    .logo {
      height: 48px;
      margin-bottom: 24px;
      object-fit: contain;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(244, 186, 67, 0.2);
      color: #b45309;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #2650a8;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 14px 28px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px -5px rgba(38, 80, 168, 0.35);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: #1d4088;
      transform: translateY(-2px);
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="/we-write-you-chill-logo.png" alt="We Write You Chill" class="logo" />
    <br />
    <span class="badge">404 Error</span>
    <h1>Page Not Found</h1>
    <p>The page you are looking for doesn't exist or has moved. We're automatically redirecting you back to the home page in a few seconds.</p>
    <a href="/" class="btn">Return to Homepage &rarr;</a>
    <div class="note">Redirecting automatically...</div>
  </div>
</body>

</html>
